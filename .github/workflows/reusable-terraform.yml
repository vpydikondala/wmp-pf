name: Reusable Terraform

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

      terraform_environment:
        required: true
        type: string

      mode:
        required: true
        type: string

      artifact_name:
        required: false
        type: string
        default: tfplan

      plan_source_artifact:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.16.2' }}

      - name: Debug GitHub OIDC claims
        if: inputs.mode == 'plan'
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail

          RESPONSE="$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"

          TOKEN="$(echo "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"

          PAYLOAD="$(echo "$TOKEN" | cut -d. -f2)"

          python3 - "$PAYLOAD" <<'PY'
          import base64
          import json
          import sys

          payload = sys.argv[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload.encode()).decode()
          )

          print("OIDC issuer:", claims.get("iss"))
          print("OIDC audience:", claims.get("aud"))
          print("OIDC subject:", claims.get("sub"))
          print("Repository:", claims.get("repository"))
          print("Environment:", claims.get("environment"))
          print("Repository owner ID:", claims.get("repository_owner_id"))
          print("Repository ID:", claims.get("repository_id"))
          PY

      - name: Configure AWS credentials - plan
        if: inputs.mode == 'plan'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-${{ inputs.environment }}-plan

      - name: Configure AWS credentials - apply
        if: inputs.mode == 'apply'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-${{ inputs.environment }}-apply

      - name: Verify AWS account
        run: |
          set -euo pipefail

          ACTUAL="$(aws sts get-caller-identity --query Account --output text)"

          echo "Target account: $ACTUAL"

          if [ "$ACTUAL" != "${{ vars.AWS_ACCOUNT_ID }}" ]; then
            echo "ERROR: Expected AWS account ${{ vars.AWS_ACCOUNT_ID }}, but authenticated to $ACTUAL"
            exit 1
          fi

      - name: Terraform init
        run: |
          terraform init -reconfigure \
            -backend-config="backends/${{ inputs.terraform_environment }}.hcl" \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: inputs.mode == 'plan'
        run: |
          terraform plan \
            -var-file="environments/${{ inputs.terraform_environment }}.tfvars" \
            -var="container_image_tag=${GITHUB_SHA}" \
            -out=tfplan

          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json

      - name: Upload plan
        if: inputs.mode == 'plan'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            terraform/tfplan
            terraform/tfplan.txt
            terraform/tfplan.json
          retention-days: 5

      - name: Download approved plan
        if: inputs.mode == 'apply'
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.plan_source_artifact }}
          path: terraform

      - name: Build and push immutable service images
        if: inputs.mode == 'apply'
        working-directory: .
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROJECT_NAME: occupancy-platform
        run: |
          ./scripts/build-push-images.sh \
            "${{ inputs.terraform_environment }}" \
            "${GITHUB_SHA}"

      - name: Apply exact plan
        if: inputs.mode == 'apply'
        run: terraform apply -auto-approve tfplan