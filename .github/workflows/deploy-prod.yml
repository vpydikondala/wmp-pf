name: Deploy PROD Blue Green

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    permissions:
      contents: read
      id-token: write

    uses: ./.github/workflows/reusable-terraform.yml

    with:
      environment: prod
      terraform_environment: prod
      mode: plan
      artifact_name: prod-tfplan

  apply:
    needs: plan

    permissions:
      contents: read
      id-token: write

    uses: ./.github/workflows/reusable-terraform.yml

    with:
      environment: prod
      terraform_environment: prod
      mode: apply
      plan_source_artifact: prod-tfplan