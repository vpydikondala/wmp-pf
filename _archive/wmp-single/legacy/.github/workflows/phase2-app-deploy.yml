name: phase2-app-deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, uat, prod]
        required: true
      image_tag:
        description: Immutable release tag, normally git SHA
        required: true
      run_nfr:
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: phase2-app-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      matrix:
        service: [inbound, processor, management, dashboard_sync]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APP_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build, scan and push
        env:
          REPO: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/occupancy-platform-${{ inputs.environment }}-${{ matrix.service }}
        run: |
          docker build --pull -t "$REPO:${{ inputs.image_tag }}" phase2/app-deploy/services/${{ matrix.service }}
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/occupancy-platform-${{ inputs.environment }}-${{ matrix.service }}:${{ inputs.image_tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/occupancy-platform-${{ inputs.environment }}-${{ matrix.service }}:${{ inputs.image_tag }}
          artifact-name: ${{ matrix.service }}-${{ inputs.image_tag }}.spdx.json
      - name: Push
        env:
          REPO: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/occupancy-platform-${{ inputs.environment }}-${{ matrix.service }}
        run: docker push "$REPO:${{ inputs.image_tag }}"
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: phase2/app-deploy/deploy
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APP_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Init
        run: >
          terraform init -reconfigure
          -backend-config="backends/${{ inputs.environment }}.hcl"
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"
      - run: terraform validate
      - run: >
          terraform plan
          -var-file="environments/${{ inputs.environment }}.tfvars"
          -var="container_image_tag=${{ inputs.image_tag }}"
          -var="infra_state_bucket=${{ vars.TF_STATE_BUCKET }}"
          -var="infra_state_kms_key_arn=${{ vars.TF_STATE_KMS_KEY_ARN }}"
          -out=tfplan
      - run: terraform apply -auto-approve tfplan
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APP_TEST_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: pip install boto3 requests pytest
      - env:
          ENVIRONMENT: ${{ inputs.environment }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          BASE_URL: ${{ vars.APPLICATION_BASE_URL }}
        run: pytest -q phase2/app-deploy/tests/smoke
